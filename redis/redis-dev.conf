# =====================================================================
# Konfigurasi Redis untuk PENGEMBANGAN LOKAL Alverse Bogor
# Hanya untuk komputer sendiri. Jangan dibuka ke internet.
# =====================================================================

# Hanya menerima koneksi dari komputer ini (bukan dari jaringan/internet)
bind 127.0.0.1 -::1
protected-mode yes
port 6379

# ---- Persistensi: data tidak hilang saat Redis/komputer dimatikan ----
# AOF: setiap perintah tulis dicatat ke file, disinkronkan ke disk setiap detik.
appendonly yes
appendfsync everysec
# RDB: snapshot berkala sebagai cadangan tambahan.
save 900 1
save 300 10
save 60 10000

# Folder penyimpanan file data (relatif terhadap folder tempat redis-server dijalankan).
# Ubah ke path absolut jika perlu, contoh: dir /home/hanif/alverse-redis-data
dir ./

# (Opsional) password untuk latihan autentikasi. Jika diaktifkan, isi REDIS_PASSWORD di .env.
# Jangan menulis password asli di file yang di-commit ke Git.
# requirepass ganti_dengan_password_latihan
